[package]
name = "play"
version = "0.1.0"
edition = "2024"
authors = ["lexoliu"]

[lib]
crate-type = ["lib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false
opt-level = 2

[features]
dev = ["waterui/dynamic_linking"]

[dependencies.waterui]
path = "/Users/lexoliu/Coding/water-rs/cli/cli-worktrees/nightly-repro/waterui"
default-features = false

[target.'cfg(not(any(target_arch = "wasm32", target_os = "espidf")))'.dependencies.waterui]
path = "/Users/lexoliu/Coding/water-rs/cli/cli-worktrees/nightly-repro/waterui"
default-features = false
features = [
    "assets",
    "media",
    "flow-markdown",
]

